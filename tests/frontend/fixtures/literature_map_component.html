<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>文献地图组件契约样例（mock API）</title>
  <link rel="stylesheet" href="../../../frontend/literature-maps.css?v=4">
  <style>
    :root { --ink: #25272b; --muted: #8b8e96; --muted-strong: #5a5d66; --accent: #6d5dfc; --accent-soft: #eeecff; }
    body { margin: 0; font-family: Arial, sans-serif; }
    #literature-maps-view { min-height: 100vh; }
  </style>
</head>
<body>
  <section id="literature-maps-view">
    <div id="literature-maps-mount"></div>
  </section>
  <script>
    const mockMap = { map_id: 'map-fixture', name: '边缘学习地图', topic: '联邦学习', status: 'ready', revision: 3, requested_count: 20, view_settings: { viewport: { x: 0, y: 0, scale: 1 }, layers: { citation: true, similarity: true } } };
    const mockNodes = [
      { node_id: 'node-a', title: 'Federated learning paper', authors: ['Author A'], year: 2024, venue: 'Fixture Venue', abstract: 'Fixture abstract', keywords: ['federated'], citation_count: 12, source_url: 'https://example.org/paper', provenance: { source: 'fixture', basis: 'metadata' }, download_status: 'not_imported', position: { x: 390, y: 300 } },
      { node_id: 'node-b', title: 'Private aggregation paper', authors: ['Author B'], year: 2023, venue: 'Fixture Venue', abstract: null, keywords: [], citation_count: 4, source_url: 'javascript:alert(1)', provenance: { source: 'fixture', basis: 'title_only' }, download_status: 'indexed', document_id: 'document-fixture', position: { x: 590, y: 360 } },
    ];
    const mockGraph = { schema_version: 'literature-map-v1', map: mockMap, nodes: mockNodes, edges: [{ edge_id: 'edge-a', map_id: 'map-fixture', kind: 'citation', source_id: 'node-a', target_id: 'node-b', provenance: 'fixture', score: null, basis: null, model_version: null, content_hash: null }, { edge_id: 'edge-sim', map_id: 'map-fixture', kind: 'similarity', source_id: 'node-a', target_id: 'node-b', provenance: 'fixture', score: 0.82, basis: 'title_only', model_version: 'fixture-v1', content_hash: 'fixture-hash' }], layers: { citation: { status: 'completed' }, similarity: { status: 'completed' } }, latest_job: { job_id: 'job-fixture', map_id: 'map-fixture', operation: 'create', status: 'completed', step: 'finished', counts: { node_count: 2, citation_edge_count: 1, similarity_edge_count: 1 } } };
    const query = new URLSearchParams(window.location.search);
    const recovery = query.has('recovery');
    const running = query.has('running');
    const indexedTombstone = query.has('indexed-tombstone');
    const refreshDiff = query.has('refresh-diff');
    const refreshEmpty = query.has('refresh-empty');
    const previewConflict = query.has('preview-conflict');
    if (indexedTombstone) mockNodes[1].removed = true;
    if (recovery) {
      mockMap.status = 'partial';
      mockGraph.latest_job = { ...mockGraph.latest_job, status: 'partial', step: 'references', failed_units: [{ unit_id: 'references-1', retryable: true }] };
    }
    if (running) {
      mockMap.status = 'generating';
      mockGraph.latest_job = { ...mockGraph.latest_job, status: 'running', step: 'references', failed_units: [{ unit_id: 'references-1', retryable: true }] };
    }
    const realDiffShape = [
      { node_id: 'node-a', changes: { citation_count: { from: 29000, to: 29014 } } },
      { node_id: 'node-b', changes: { abstract: { from: '<img src=x onerror=alert(1)>', to: '摘要已更新' } } },
      { node_id: 'node-a', changes: { relations: { added: ['node-b'], removed: [] } } },
      { node_id: 'node-a', changes: { citation_count: { from: 674, to: 676 } } },
      { node_id: 'node-a', changes: { citation_count: { from: 76, to: 77 } } },
      { node_id: 'node-a', changes: { citation_count: { from: 758, to: 759 } } },
      { node_id: 'node-a', changes: { citation_count: { from: null, to: 605 } } },
      { node_id: 'node-a', changes: { venue: { from: '', to: undefined } } },
    ];
    const previewState = { preview_id: 'preview-fixture', map_id: mockMap.map_id, kind: 'references', status: 'completed', base_revision: mockMap.revision, candidates: [
      { candidate_id: 'candidate-existing', title: 'Existing paper', authors: ['Existing'], year: 2022, already_present: true, removed: false },
      { candidate_id: 'candidate-removed', node_id: 'node-a', title: 'Removed paper', authors: ['Removed'], year: 2021, already_present: false, removed: true },
      { candidate_id: 'candidate-new', title: 'New candidate', authors: ['New Author'], year: 2025, already_present: false, removed: false },
    ], diff: refreshEmpty ? [] : (refreshDiff ? realDiffShape : []) };
    window.__lastImportBody = null;
    window.__viewBodies = [];
    window.__createBody = null;
    window.__applyBody = null;
    window.__applyCount = 0;
    window.__previewBodies = [];
    window.__jobActionBodies = [];
    window.__nodeActionBodies = [];
    const optionsFail = query.has('options-fail');
    const optionsDelay = query.has('options-delay');
    const projectsTruncated = query.has('projects-truncated');
    window.fetch = async (input, init) => {
      const parsed = new URL(String(input), window.location.href);
      const path = parsed.pathname + parsed.search;
      const method = String(init?.method || 'GET').toUpperCase();
      let body = {};
      if (init && init.body) body = JSON.parse(init.body);
      let payload = { schema_version: 'literature-map-v1' };
      if (optionsDelay && (path.startsWith('/api/papers/sources') || path.startsWith('/api/papers/conferences') || path.startsWith('/api/projects'))) {
        await new Promise((resolve) => window.setTimeout(resolve, 160));
      }
      if (optionsFail && (path.startsWith('/api/papers/sources') || path.startsWith('/api/papers/conferences') || path.startsWith('/api/projects'))) {
        return new Response(JSON.stringify({ detail: { code: 'OPTIONS_UNAVAILABLE', message: '筛选项暂不可用' } }), { status: 503, headers: { 'Content-Type': 'application/json' } });
      }
      if (path === '/api/papers/sources') payload = { sources: [{ source_id: 'usenix', source_kind: 'usenix', enabled: true }, { source_id: 'semantic_scholar', source_kind: 'semantic_scholar', enabled: true }] };
      else if (path === '/api/papers/conferences') payload = { conferences: [{ conference_id: 'ccs', name: 'ACM CCS', short_name: 'CCS', enabled: true }] };
      else if (path.startsWith('/api/projects')) payload = { projects: [{ project_id: 'project-fixture', name: 'Research Notes', status: 'active' }], next_cursor: projectsTruncated ? 'cursor-more' : null };
      else if (path === '/api/literature-maps' && method === 'POST') {
        window.__createBody = body;
        payload = { schema_version: 'literature-map-v1', map_id: mockMap.map_id, job_id: mockGraph.latest_job.job_id, status: 'generating', map: { ...mockMap, status: 'generating' }, job: { ...mockGraph.latest_job, status: 'running', step: 'discover' } };
      } else if (path === '/api/literature-maps') payload.maps = [mockMap];
      else if (path === '/api/literature-maps/map-fixture') payload = { schema_version: 'literature-map-v1', map: mockMap, latest_job: mockGraph.latest_job };
      else if (path === '/api/literature-maps/map-fixture/graph') payload = mockGraph;
      else if (path === '/api/literature-maps/map-fixture/nodes/node-a') payload.node = mockNodes[0];
      else if (path === '/api/literature-maps/map-fixture/nodes/node-b') payload.node = mockNodes[1];
      else if (path === '/api/literature-maps/map-fixture/nodes/node-new') payload.node = mockNodes.find((node) => node.node_id === 'node-new');
      else if (path.endsWith('/previews') && method === 'POST') {
        window.__previewBodies.push(body);
        previewState.preview_id = `preview-fixture-${window.__previewBodies.length}`;
        previewState.kind = body.kind;
        previewState.base_revision = mockMap.revision;
        payload = { schema_version: 'literature-map-v1', preview_id: previewState.preview_id, map_id: mockMap.map_id, job_id: 'job-preview', status: 'completed', base_revision: mockMap.revision, job: { job_id: 'job-preview', map_id: mockMap.map_id, operation: 'preview', status: 'completed', step: 'finished' } };
      } else if (path.includes('/previews/') && path.endsWith('/apply') && method === 'POST') {
        window.__applyCount += 1;
        if (previewConflict && window.__applyCount === 1) return new Response(JSON.stringify({ detail: { code: 'MAP_REVISION_CONFLICT', message: '地图版本已变化' } }), { status: 409, headers: { 'Content-Type': 'application/json' } });
        window.__applyBody = body;
        if (previewState.kind !== 'refresh' && !mockNodes.some((node) => node.node_id === 'node-new')) mockNodes.push({ node_id: 'node-new', title: 'New candidate', authors: ['New Author'], year: 2025, venue: 'Fixture Venue', abstract: 'New candidate abstract', keywords: [], citation_count: 0, source_url: 'https://example.org/new', provenance: { source: 'fixture' }, download_status: 'not_imported', position: { x: 720, y: 420 } });
        mockMap.revision += 1;
        previewState.status = 'applied';
        payload = { schema_version: 'literature-map-v1', preview_id: previewState.preview_id, map: mockMap, job: mockGraph.latest_job, added_node_ids: previewState.kind === 'refresh' ? [] : ['node-new'] };
      } else if (path.includes('/previews/') && method === 'GET') {
        payload = { schema_version: 'literature-map-v1', preview: { ...previewState, candidates: previewState.candidates.map((candidate) => ({ ...candidate })), diff: [...previewState.diff] }, job: { job_id: 'job-preview', map_id: mockMap.map_id, operation: 'preview', status: previewState.status === 'applied' ? 'completed' : 'completed', step: 'finished' } };
      } else if (path.endsWith('/stop') && method === 'POST') {
        window.__jobActionBodies.push({ ...body, action: 'stop' });
        mockGraph.latest_job = { ...mockGraph.latest_job, status: 'stopped', failed_units: [{ unit_id: 'references-1', retryable: true }] };
        payload = { schema_version: 'literature-map-v1', job: mockGraph.latest_job };
      } else if (path.endsWith('/retry') && method === 'POST') {
        window.__jobActionBodies.push({ ...body, action: 'retry' });
        mockGraph.latest_job = { ...mockGraph.latest_job, status: 'running', step: 'references', failed_units: [] };
        payload = { schema_version: 'literature-map-v1', job: mockGraph.latest_job };
      } else if (path.endsWith('/remove') && method === 'POST') {
        const nodeId = path.match(/\/nodes\/([^/]+)\/remove$/)?.[1];
        const node = mockNodes.find((item) => item.node_id === nodeId);
        if (node) node.removed = true;
        window.__nodeActionBodies.push({ ...body, action: 'remove' });
        mockMap.revision += 1;
        payload = { schema_version: 'literature-map-v1', map: mockMap, removed_node_id: nodeId };
      } else if (path.endsWith('/restore') && method === 'POST') {
        const nodeId = path.match(/\/nodes\/([^/]+)\/restore$/)?.[1];
        const node = mockNodes.find((item) => item.node_id === nodeId);
        if (node) node.removed = false;
        window.__nodeActionBodies.push({ ...body, action: 'restore' });
        mockMap.revision += 1;
        payload = { schema_version: 'literature-map-v1', map: mockMap, restored_node_id: nodeId, job: mockGraph.latest_job };
      }
      else if (path.endsWith('/view')) {
        window.__viewBodies.push(body);
        mockMap.revision += 1;
        mockMap.view_settings = body;
        (body.positions || []).forEach((position) => {
          const node = mockNodes.find((item) => item.node_id === position.node_id);
          if (node) node.position = { x: position.x, y: position.y };
        });
        payload.map = mockMap;
      }
      else if (path.endsWith('/imports')) { window.__lastImportBody = body; payload = { schema_version: 'literature-map-v1', status: 'queued', import_id: 'import-fixture' }; }
      return new Response(JSON.stringify(payload), { status: 200, headers: { 'Content-Type': 'application/json' } });
    };
  </script>
  <script src="../../../frontend/literature-maps.js?v=6"></script>
  <script>window.LiteratureMaps.setActive(true);</script>
</body>
</html>
