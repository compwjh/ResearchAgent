  <script>
    // Mirror the production global-nav event contract without loading the
    // full application shell into this component-only fixture.
    (() => {
      const mobileNavToggle = document.querySelector('#mobile-nav-toggle');
      const mobileNavClose = document.querySelector('#mobile-nav-close');
      const mobileNavBackdrop = document.querySelector('#mobile-nav-backdrop');
      const mobileSidebar = document.querySelector('#mobile-sidebar');
      const mobileDrawerState = { open: false, restoreFocus: null };
      const mobileTriggerIsVisible = () => {
        if (!mobileNavToggle?.isConnected || mobileNavToggle.hidden) return false;
        return window.getComputedStyle(mobileNavToggle).display !== 'none';
      };
      const closeMobileDrawer = (restoreFocus = false) => {
        if (!mobileSidebar || !mobileDrawerState.open) return;
        mobileSidebar.classList.remove('mobile-nav-open');
        if (mobileNavBackdrop) mobileNavBackdrop.hidden = true;
        mobileNavToggle?.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('mobile-nav-is-open');
        const target = mobileTriggerIsVisible() ? (mobileDrawerState.restoreFocus || mobileNavToggle) : null;
        mobileDrawerState.restoreFocus = null;
        mobileDrawerState.open = false;
        if (restoreFocus && target?.isConnected) target.focus();
      };
      const openMobileDrawer = () => {
        if (!mobileSidebar) return;
        mobileDrawerState.restoreFocus = document.activeElement;
        mobileDrawerState.open = true;
        mobileSidebar.classList.add('mobile-nav-open');
        if (mobileNavBackdrop) mobileNavBackdrop.hidden = false;
        mobileNavToggle?.setAttribute('aria-expanded', 'true');
        document.body.classList.add('mobile-nav-is-open');
        mobileNavClose?.focus();
      };
      mobileNavToggle?.addEventListener('click', () => {
        if (mobileSidebar?.classList.contains('mobile-nav-open')) closeMobileDrawer(true);
        else openMobileDrawer();
      });
      mobileNavClose?.addEventListener('click', () => closeMobileDrawer(true));
      mobileNavBackdrop?.addEventListener('click', () => closeMobileDrawer(true));
      mobileSidebar?.addEventListener('click', (event) => {
        if (!mobileSidebar.classList.contains('mobile-nav-open')) return;
        if (event.target.closest('.mobile-nav-close')) return;
        if (event.target.closest('button, .nav-item')) closeMobileDrawer(true);
      });
      document.addEventListener('keydown', (event) => {
        if (event.key !== 'Escape') return;
        if (mobileSidebar?.classList.contains('mobile-nav-open')) closeMobileDrawer(true);
      });
    })();
  </script>
  <script>
    const mockMap = { map_id: 'map-fixture', name: '边缘学习地图', topic: '联邦学习', status: 'ready', revision: 3, requested_count: 20, view_settings: { viewport: { x: 0, y: 0, scale: 1 }, layers: { citation: true, similarity: true } } };
    const mockGroups = [{ group_id: 'group-fixture', name: '人工分组', color: '#3366cc' }];
    const mockNodes = [
      { node_id: 'node-a', title: 'Federated learning paper', authors: ['Author A'], year: 2024, venue: 'Fixture Venue', abstract: 'Fixture abstract', keywords: ['federated'], citation_count: 12, source_url: 'https://example.org/paper', provenance: { source: 'fixture', basis: 'metadata' }, download_status: 'not_imported', group_id: null, position: { x: 390, y: 300 } },
      { node_id: 'node-b', title: 'Private aggregation paper', authors: ['Author B'], year: 2023, venue: 'Fixture Venue', abstract: null, keywords: [], citation_count: 4, source_url: 'javascript:alert(1)', provenance: { source: 'fixture', basis: 'title_only' }, download_status: 'indexed', document_id: 'document-fixture', group_id: null, position: { x: 590, y: 360 } },
    ];
    const mockGraph = { schema_version: 'literature-map-v1', map: mockMap, nodes: mockNodes, edges: [{ edge_id: 'edge-a', map_id: 'map-fixture', kind: 'citation', source_id: 'node-a', target_id: 'node-b', provenance: 'fixture', score: null, basis: null, model_version: null, content_hash: null }, { edge_id: 'edge-sim', map_id: 'map-fixture', kind: 'similarity', source_id: 'node-a', target_id: 'node-b', provenance: 'fixture', score: 0.82, basis: 'title_only', model_version: 'fixture-v1', content_hash: 'fixture-hash' }], layers: { citation: { status: 'completed' }, similarity: { status: 'completed' } }, latest_job: { job_id: 'job-fixture', map_id: 'map-fixture', operation: 'create', status: 'completed', step: 'finished', counts: { node_count: 2, citation_edge_count: 1, similarity_edge_count: 1 } } };
    const query = new URLSearchParams(window.location.search);
    const analysisMode = query.has('analysis') || query.has('analysis-fail') || query.has('analysis-race') || query.has('analysis-poll-limit');
    const analysisFail = query.has('analysis-fail');
    const analysisRace = query.has('analysis-race');
    const analysisPollLimit = query.has('analysis-poll-limit');
    const recovery = query.has('recovery');
    const running = query.has('running');
    const indexedTombstone = query.has('indexed-tombstone');
    const refreshDiff = query.has('refresh-diff');
    const refreshEmpty = query.has('refresh-empty');
    const previewConflict = query.has('preview-conflict');
    const pagedPreview = query.has('paged-preview') || query.has('paged-preview-delay') || query.has('paged-preview-race') || query.has('paged-preview-stall');
    const previewCursorStall = query.has('paged-preview-stall');
    const serverPreview = query.has('server-preview') || query.has('server-preview-delay') || query.has('server-preview-race') || pagedPreview;
    const serverPreviewDelay = query.has('server-preview-delay') || query.has('server-preview-race') || query.has('paged-preview-delay') || query.has('paged-preview-race');
    const latestRestore = query.has('latest-restore');
    const mobileLong = query.has('mobile-long');
    if (mobileLong) {
      mockMap.name = `移动端长内容地图：${'边界 '.repeat(12)}`;
      mockMap.topic = `移动端长主题：${'联邦学习 '.repeat(10)}`;
      mockNodes[0].title = `移动端可滚动论文标题：${'多指交互 '.repeat(10)}`;
      mockNodes[0].abstract = `移动端详情抽屉滚动夹具。${'该段摘要用于验证真实触摸滚动不会被地图手势劫持。'.repeat(80)}`;
      mockGroups.push(...Array.from({ length: 36 }, (_, index) => ({
        group_id: `group-mobile-${index + 1}`,
        name: `移动端分组 ${index + 1}：${'长内容 '.repeat(8)}`,
        color: '#3366cc',
      })));
    }
    const serverPreviewRace = query.has('server-preview-race') || query.has('paged-preview-race');
    if (indexedTombstone) mockNodes[1].removed = true;
    if (recovery) {
      mockMap.status = 'partial';
      mockGraph.latest_job = { ...mockGraph.latest_job, status: 'partial', step: 'references', failed_units: [{ unit_id: 'references-1', retryable: true }] };
    }
    if (running) {
      mockMap.status = 'generating';
      mockGraph.latest_job = { ...mockGraph.latest_job, status: 'running', step: 'references', failed_units: [{ unit_id: 'references-1', retryable: true }] };
    }
    const realDiffShape = [
      { node_id: 'node-a', changes: { citation_count: { from: 29000, to: 29014 } } },
      { node_id: 'node-b', changes: { abstract: { from: '<img src=x onerror=alert(1)>', to: '摘要已更新' } } },
      { node_id: 'node-a', changes: { relations: { added: ['node-b'], removed: [] } } },
      { node_id: 'node-a', changes: { citation_count: { from: 674, to: 676 } } },
      { node_id: 'node-a', changes: { citation_count: { from: 76, to: 77 } } },
      { node_id: 'node-a', changes: { citation_count: { from: 758, to: 759 } } },
      { node_id: 'node-a', changes: { citation_count: { from: null, to: 605 } } },
      { node_id: 'node-a', changes: { venue: { from: '', to: undefined } } },
    ];
    const previewState = { preview_id: 'preview-fixture', map_id: mockMap.map_id, kind: 'references', status: 'completed', base_revision: mockMap.revision, candidates: [
      { candidate_id: 'candidate-existing', title: 'Existing paper', authors: ['Existing'], year: 2022, already_present: true, removed: false },
      { candidate_id: 'candidate-removed', node_id: 'node-a', title: 'Removed paper', authors: ['Removed'], year: 2021, already_present: false, removed: true },
      { candidate_id: 'candidate-new', title: 'New candidate', authors: ['New Author'], year: 2025, already_present: false, removed: false },
    ], diff: refreshEmpty ? [] : (refreshDiff ? realDiffShape : []) };
    if (serverPreview) Object.assign(previewState, { preview_id: pagedPreview ? 'preview-server-paged' : 'preview-server', kind: 'refresh', status: 'completed', diff: realDiffShape });
    const secondMap = { ...mockMap, map_id: 'map-fixture-b', name: '第二张地图', topic: '第二主题' };
    if (latestRestore) mockGraph.latest_job = { ...mockGraph.latest_job, job_id: 'job-restore', operation: 'restore', status: 'completed', step: 'restore' };
    window.__lastImportBody = null;
    window.__viewBodies = [];
    window.__groupBodies = [];
    window.__nodeGroupBodies = [];
    window.__createBody = null;
    window.__applyBody = null;
    window.__applyCount = 0;
    window.__previewBodies = [];
    window.__analysisBodies = [];
    window.__conversationBodies = [];
    window.__analysisDetailCalls = 0;
    window.__openedConversation = null;
    window.__jobActionBodies = [];
    window.__nodeActionBodies = [];
    window.__requestLog = [];
    window.openConversationFromWorkspace = (conversationId) => { window.__openedConversation = conversationId; };
    if (analysisPollLimit) {
      const fixtureSetTimeout = window.setTimeout.bind(window);
      window.setTimeout = (callback, delay, ...args) => fixtureSetTimeout(callback, Math.min(Number(delay) || 0, 1), ...args);
    }
    const analysisResult = {
      summary: '摘要级分析结果：<img src=x onerror=alert(1)>',
      citations: [{ source: 'fixture', locator: '摘要' }],
      source_refs: [{ source_version: 'source-abstract-v1', evidence_level: 'abstract' }],
    };
    const oldAnalysisRecord = {
      analysis_id: 'analysis-fixture-old', map_id: mockMap.map_id, node_id: 'node-a', version: 0,
      status: 'completed', evidence_level: 'abstract', source_version: 'source-abstract-old', model_id: 'fixture-model',
      job_id: 'job-analysis-fixture-old', result: { summary: '旧版本摘要结果', citations: [], source_refs: [] }, error: null,
      created_at: '2026-10-19T00:00:00Z',
    };
    const analysisRecord = {
      analysis_id: 'analysis-fixture', map_id: mockMap.map_id, node_id: 'node-a', version: 1,
      status: analysisFail ? 'failed' : 'completed', evidence_level: 'abstract', source_version: 'source-abstract-v1',
      model_id: 'fixture-model', job_id: 'job-analysis-fixture', result: analysisFail ? null : analysisResult,
      error: analysisFail ? { code: 'MAP_MODEL_UNAVAILABLE', message: '模型暂时不可用', retryable: true } : null,
      created_at: '2026-10-20T00:00:00Z',
    };
    const optionsFail = query.has('options-fail');
    const optionsDelay = query.has('options-delay');
    const projectsTruncated = query.has('projects-truncated');
    window.fetch = async (input, init) => {
      const parsed = new URL(String(input), window.location.href);
      const path = parsed.pathname + parsed.search;
      const method = String(init?.method || 'GET').toUpperCase();
      window.__requestLog.push({ method, path });
      let body = {};
      if (init && init.body) body = JSON.parse(init.body);
      let payload = { schema_version: 'literature-map-v1' };
      if (optionsDelay && (path.startsWith('/api/papers/sources') || path.startsWith('/api/papers/conferences') || path.startsWith('/api/projects'))) {
        await new Promise((resolve) => window.setTimeout(resolve, 160));
      }
      if (optionsFail && (path.startsWith('/api/papers/sources') || path.startsWith('/api/papers/conferences') || path.startsWith('/api/projects'))) {
        return new Response(JSON.stringify({ detail: { code: 'OPTIONS_UNAVAILABLE', message: '筛选项暂不可用' } }), { status: 503, headers: { 'Content-Type': 'application/json' } });
      }
      if (path === '/api/papers/sources') payload = { sources: [{ source_id: 'usenix', source_kind: 'usenix', enabled: true }, { source_id: 'semantic_scholar', source_kind: 'semantic_scholar', enabled: true }] };
      else if (path === '/api/papers/conferences') payload = { conferences: [{ conference_id: 'ccs', name: 'ACM CCS', short_name: 'CCS', enabled: true }] };
      else if (path.startsWith('/api/projects')) payload = { projects: [{ project_id: 'project-fixture', name: 'Research Notes', status: 'active' }], next_cursor: projectsTruncated ? 'cursor-more' : null };
      else if (path === '/api/literature-maps' && method === 'POST') {
        window.__createBody = body;
        payload = { schema_version: 'literature-map-v1', map_id: mockMap.map_id, job_id: mockGraph.latest_job.job_id, status: 'generating', map: { ...mockMap, status: 'generating' }, job: { ...mockGraph.latest_job, status: 'running', step: 'discover' } };
      } else if (path === '/api/literature-maps') payload.maps = (serverPreviewRace || analysisRace) ? [mockMap, secondMap] : [mockMap];
      else if (path === '/api/literature-maps/map-fixture') payload = { schema_version: 'literature-map-v1', map: mockMap, latest_job: mockGraph.latest_job };
      else if (path === '/api/literature-maps/map-fixture-b') payload = { schema_version: 'literature-map-v1', map: secondMap, latest_job: { ...mockGraph.latest_job, map_id: secondMap.map_id, job_id: 'job-fixture-b' } };
      else if (path === '/api/literature-maps/map-fixture/graph') payload = mockGraph;
      else if (path === '/api/literature-maps/map-fixture/groups' && method === 'GET') payload = { schema_version: 'literature-map-v1', map_id: mockMap.map_id, revision: mockMap.revision, groups: mockGroups.map((group) => ({ ...group })) };
      else if (path === '/api/literature-maps/map-fixture/groups' && method === 'POST') {
        window.__groupBodies.push(body);
        const group = { group_id: `group-${mockGroups.length + 1}`, name: body.name, color: body.color };
        mockGroups.push(group);
        mockMap.revision += 1;
        payload = { schema_version: 'literature-map-v1', map_id: mockMap.map_id, revision: mockMap.revision, groups: mockGroups.map((item) => ({ ...item })) };
      }
      else if (path.match(/\/api\/literature-maps\/map-fixture\/groups\/[^/]+$/) && method === 'PATCH') {
        window.__groupBodies.push(body);
        const groupId = path.split('/').pop();
        const group = mockGroups.find((item) => item.group_id === groupId);
        if (group) Object.assign(group, { name: body.name || group.name, color: body.color || group.color });
        mockMap.revision += 1;
        payload = { schema_version: 'literature-map-v1', map_id: mockMap.map_id, revision: mockMap.revision, groups: mockGroups.map((item) => ({ ...item })) };
      }
      else if (path.match(/\/api\/literature-maps\/map-fixture\/groups\/[^/]+$/) && method === 'DELETE') {
        window.__groupBodies.push(body);
        const groupId = path.split('/').pop();
        const index = mockGroups.findIndex((item) => item.group_id === groupId);
        if (index >= 0) mockGroups.splice(index, 1);
        mockNodes.forEach((node) => { if (node.group_id === groupId) node.group_id = null; });
        mockMap.revision += 1;
        payload = { schema_version: 'literature-map-v1', map_id: mockMap.map_id, revision: mockMap.revision, groups: mockGroups.map((item) => ({ ...item })) };
      }
      else if (path.match(/\/api\/literature-maps\/map-fixture\/nodes\/[^/]+\/group$/) && method === 'PUT') {
        window.__nodeGroupBodies.push(body);
        const nodeId = path.split('/').slice(-2, -1)[0];
        const node = mockNodes.find((item) => item.node_id === nodeId);
        if (node) node.group_id = body.group_id || null;
        mockMap.revision += 1;
        payload = { schema_version: 'literature-map-v1', map_id: mockMap.map_id, revision: mockMap.revision, node: node ? { ...node } : null };
      }
      else if (path === '/api/literature-maps/map-fixture/export?format=json' && method === 'GET') {
        payload = { schema_version: 'literature-map-export-v1', exported_at: '2026-10-21T00:00:00Z', map: { ...mockMap }, groups: mockGroups.map((item) => ({ ...item })), nodes: mockNodes.map((item) => ({ ...item })), edges: mockGraph.edges.map((item) => ({ ...item })) };
        return new Response(JSON.stringify(payload), { status: 200, headers: { 'Content-Type': 'application/json', 'Content-Disposition': 'attachment; filename="map-fixture.json"' } });
      }
      else if (path === '/api/literature-maps/map-fixture-b/graph') payload = { ...mockGraph, map: secondMap, latest_job: { ...mockGraph.latest_job, map_id: secondMap.map_id, job_id: 'job-fixture-b' } };
      else if (analysisMode && path === '/api/literature-maps/map-fixture/nodes/node-a/analyses' && method === 'GET') {
        if (analysisRace) await new Promise((resolve) => window.setTimeout(resolve, 180));
        payload = {
          schema_version: 'literature-map-v1',
          analyses: [analysisRecord, oldAnalysisRecord],
          source_status: {
            abstract_available: true,
            fulltext_ready: false,
            available_evidence_levels: ['abstract'],
            source_versions: { abstract: 'source-abstract-v1' },
            unavailable_reason: '全文索引尚未就绪',
          },
        };
      } else if (analysisMode && path.endsWith('/analyses') && method === 'POST') {
        window.__analysisBodies.push(body);
        payload = {
          schema_version: 'literature-map-v1', map_id: mockMap.map_id, node_id: 'node-a', analysis_id: 'analysis-fixture',
          job_id: 'job-analysis-fixture', status: 'queued', analysis: { ...analysisRecord, status: 'queued', result: null, error: null },
          job: { job_id: 'job-analysis-fixture', map_id: mockMap.map_id, operation: 'analysis', status: 'running', step: 'generate' },
        };
      } else if (analysisMode && path.includes('/analyses/analysis-fixture') && method === 'GET') {
        window.__analysisDetailCalls += 1;
        const detailStatus = analysisFail ? 'failed' : (analysisPollLimit ? 'running' : 'completed');
        payload = {
          schema_version: 'literature-map-v1',
          analysis: { ...analysisRecord, status: detailStatus, result: detailStatus === 'completed' ? analysisResult : null, error: detailStatus === 'failed' ? analysisRecord.error : null },
          job: { job_id: 'job-analysis-fixture', map_id: mockMap.map_id, operation: 'analysis', status: detailStatus, step: detailStatus === 'completed' ? 'finished' : 'generate' },
        };
      } else if (analysisMode && path.endsWith('/conversation') && method === 'POST') {
        window.__conversationBodies.push(body);
        payload = {
          schema_version: 'literature-map-v1', conversation_id: 'conversation-fixture', created: false,
          project_id: null, evidence_level: body.evidence_level, source_version: 'source-abstract-v1',
          context: { map_id: mockMap.map_id, node_id: 'node-a', title: mockNodes[0].title },
        };
      }
      else if (path.includes('/events?') && method === 'GET') {
        if (serverPreviewDelay) await new Promise((resolve) => window.setTimeout(resolve, 180));
        const isPrimary = path.startsWith('/api/literature-maps/map-fixture/');
        const afterSeq = Number(new URLSearchParams(parsed.search).get('after_seq') || 0);
        if (isPrimary && pagedPreview) {
          const firstPage = Array.from({ length: 200 }, (_, index) => ({ event_seq: index + 1, map_id: mockMap.map_id, job_id: 'job-fixture', type: 'progress', status: 'completed', step: 'discover', counts: {}, error_code: null }));
          const secondPage = [
            { event_seq: 201, map_id: mockMap.map_id, job_id: 'job-server-preview-paged', type: 'preview_queued', status: 'queued', step: 'preview', counts: {}, error_code: null },
            { event_seq: 202, map_id: mockMap.map_id, job_id: 'job-server-preview-paged', type: 'preview_completed', status: 'completed', step: 'finished', counts: { candidate_count: 21 }, error_code: null },
            ...(latestRestore ? [{ event_seq: 203, map_id: mockMap.map_id, job_id: 'job-restore', type: 'progress', status: 'completed', step: 'restore', counts: {}, error_code: null }] : []),
          ];
          payload = previewCursorStall
            ? { events: firstPage, next_cursor: 0 }
            : afterSeq === 0
              ? { events: firstPage, next_cursor: 200 }
              : afterSeq === 200
                ? { events: secondPage, next_cursor: latestRestore ? 203 : 202 }
                : { events: [], next_cursor: afterSeq };
        } else {
          payload = isPrimary && serverPreview ? { events: [
            { event_seq: 3, map_id: mockMap.map_id, job_id: 'job-server-preview', type: 'preview_queued', status: 'queued', step: 'preview', counts: {}, error_code: null },
            { event_seq: 4, map_id: mockMap.map_id, job_id: 'job-server-preview', type: 'preview_completed', status: 'completed', step: 'finished', counts: { candidate_count: 21 }, error_code: null },
            ...(latestRestore ? [{ event_seq: 5, map_id: mockMap.map_id, job_id: 'job-restore', type: 'progress', status: 'completed', step: 'restore', counts: {}, error_code: null }] : []),
          ], next_cursor: latestRestore ? 5 : 4 } : { events: [], next_cursor: 0 };
        }
      } else if (path.includes('/jobs/') && method === 'GET') {
        if (serverPreviewDelay) await new Promise((resolve) => window.setTimeout(resolve, 180));
        const match = path.match(/\/api\/literature-maps\/([^/]+)\/jobs\/([^/?]+)$/);
        const mapId = match?.[1] || mockMap.map_id;
        const jobId = match?.[2] || '';
        const isPreviewJob = jobId === 'job-server-preview' || jobId === 'job-server-preview-paged';
        payload = { job: { job_id: jobId, map_id: mapId, operation: isPreviewJob ? 'preview' : 'restore', status: 'completed', step: isPreviewJob ? 'finished' : 'restore', cursor: isPreviewJob ? { preview_id: jobId === 'job-server-preview-paged' ? 'preview-server-paged' : 'preview-server' } : {}, counts: {} } };
      }
      else if (path === '/api/literature-maps/map-fixture/nodes/node-a') payload.node = mockNodes[0];
      else if (path === '/api/literature-maps/map-fixture/nodes/node-b') payload.node = mockNodes[1];
      else if (path === '/api/literature-maps/map-fixture/nodes/node-new') payload.node = mockNodes.find((node) => node.node_id === 'node-new');
      else if (path.endsWith('/previews') && method === 'POST') {
        window.__previewBodies.push(body);
        previewState.preview_id = `preview-fixture-${window.__previewBodies.length}`;
        previewState.kind = body.kind;
        previewState.base_revision = mockMap.revision;
        payload = { schema_version: 'literature-map-v1', preview_id: previewState.preview_id, map_id: mockMap.map_id, job_id: 'job-preview', status: 'completed', base_revision: mockMap.revision, job: { job_id: 'job-preview', map_id: mockMap.map_id, operation: 'preview', status: 'completed', step: 'finished' } };
      } else if (path.includes('/previews/') && path.endsWith('/apply') && method === 'POST') {
        window.__applyCount += 1;
        if (previewConflict && window.__applyCount === 1) return new Response(JSON.stringify({ detail: { code: 'MAP_REVISION_CONFLICT', message: '地图版本已变化' } }), { status: 409, headers: { 'Content-Type': 'application/json' } });
        window.__applyBody = body;
        if (previewState.kind !== 'refresh' && !mockNodes.some((node) => node.node_id === 'node-new')) mockNodes.push({ node_id: 'node-new', title: 'New candidate', authors: ['New Author'], year: 2025, venue: 'Fixture Venue', abstract: 'New candidate abstract', keywords: [], citation_count: 0, source_url: 'https://example.org/new', provenance: { source: 'fixture' }, download_status: 'not_imported', position: { x: 720, y: 420 } });
        mockMap.revision += 1;
        previewState.status = 'applied';
        payload = { schema_version: 'literature-map-v1', preview_id: previewState.preview_id, map: mockMap, job: mockGraph.latest_job, added_node_ids: previewState.kind === 'refresh' ? [] : ['node-new'] };
      } else if (path.includes('/previews/') && method === 'GET') {
        if (serverPreviewDelay) await new Promise((resolve) => window.setTimeout(resolve, 180));
        payload = { schema_version: 'literature-map-v1', preview: { ...previewState, candidates: previewState.candidates.map((candidate) => ({ ...candidate })), diff: [...previewState.diff] }, job: { job_id: 'job-preview', map_id: mockMap.map_id, operation: 'preview', status: previewState.status === 'applied' ? 'completed' : 'completed', step: 'finished' } };
      } else if (path.endsWith('/stop') && method === 'POST') {
        window.__jobActionBodies.push({ ...body, action: 'stop' });
        mockGraph.latest_job = { ...mockGraph.latest_job, status: 'stopped', failed_units: [{ unit_id: 'references-1', retryable: true }] };
        payload = { schema_version: 'literature-map-v1', job: mockGraph.latest_job };
      } else if (path.endsWith('/retry') && method === 'POST') {
        window.__jobActionBodies.push({ ...body, action: 'retry' });
        mockGraph.latest_job = { ...mockGraph.latest_job, status: 'running', step: 'references', failed_units: [] };
        payload = { schema_version: 'literature-map-v1', job: mockGraph.latest_job };
      } else if (path.endsWith('/remove') && method === 'POST') {
        const nodeId = path.match(/\/nodes\/([^/]+)\/remove$/)?.[1];
        const node = mockNodes.find((item) => item.node_id === nodeId);
        if (node) node.removed = true;
        window.__nodeActionBodies.push({ ...body, action: 'remove' });
        mockMap.revision += 1;
        payload = { schema_version: 'literature-map-v1', map: mockMap, removed_node_id: nodeId };
      } else if (path.endsWith('/restore') && method === 'POST') {
        const nodeId = path.match(/\/nodes\/([^/]+)\/restore$/)?.[1];
        const node = mockNodes.find((item) => item.node_id === nodeId);
        if (node) node.removed = false;
        window.__nodeActionBodies.push({ ...body, action: 'restore' });
        mockMap.revision += 1;
        payload = { schema_version: 'literature-map-v1', map: mockMap, restored_node_id: nodeId, job: mockGraph.latest_job };
      }
      else if (path.endsWith('/view')) {
        window.__viewBodies.push(body);
        mockMap.revision += 1;
        mockMap.view_settings = body;
        (body.positions || []).forEach((position) => {
          const node = mockNodes.find((item) => item.node_id === position.node_id);
          if (node) node.position = { x: position.x, y: position.y };
        });
        payload.map = mockMap;
      }
      else if (path.endsWith('/imports')) { window.__lastImportBody = body; payload = { schema_version: 'literature-map-v1', status: 'queued', import_id: 'import-fixture' }; }
      return new Response(JSON.stringify(payload), { status: 200, headers: { 'Content-Type': 'application/json' } });
    };
  </script>
  <script src="../../../frontend/literature-maps.js?v=13"></script>
  <script>window.LiteratureMaps.setActive(true);</script>
