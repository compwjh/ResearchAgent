<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Studio</title>
  <link rel="stylesheet" href="/assets/styles.css?v=2">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">O</span><span>Ollama Studio</span></div>
      <button class="new-chat" type="button"><span class="plus">+</span> 新建对话</button>
      <nav class="side-nav" aria-label="主导航">
        <p class="nav-label">工作区</p>
        <a class="nav-item active" data-view="chat" role="button" tabindex="0"><span class="nav-icon">◌</span> 对话</a>
        <a class="nav-item" data-view="models" role="button" tabindex="0"><span class="nav-icon">◈</span> 模型库 <span class="nav-count" id="model-count">0</span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-card"><span class="status-dot"></span><div><strong>本地服务</strong><small id="model-label">连接中</small></div></div>
        <div class="profile"><span class="profile-mark">W</span><div><strong>本地工作区</strong><small>Ollama</small></div><span class="more">···</span></div>
      </div>
    </aside>

    <section class="main-area" id="chat">
      <header class="topbar">
        <div class="breadcrumb"><span>对话</span><span class="slash">/</span><strong>新会话</strong></div>
        <div class="header-tools">
          <label class="mode-picker" for="mode-select"><span>模式</span>
            <select id="mode-select"><option value="normal">Normal</option><option value="developer">Developer</option></select>
          </label>
          <button class="icon-button" id="settings-button" type="button" aria-label="打开 Agent 设置" title="Agent 设置">⚙</button>
        </div>
      </header>

      <section class="workspace" aria-label="聊天窗口">
        <div class="welcome">
          <div class="welcome-orb">✦</div>
          <p class="eyebrow">LOCAL AI WORKSPACE</p>
          <h1>今天想一起<br><span>探索什么？</span></h1>
          <p class="subtitle">你的对话在本地运行，安静、快速，也更私密。</p>
        </div>

        <section class="chat-panel">
          <div class="chat-header">
            <label class="model-picker" for="model-select"><span class="model-symbol">◈</span>
              <select id="model-select" disabled><option>加载中...</option></select>
            </label>
            <span class="chat-state">新会话</span>
          </div>
          <div class="messages" id="messages">
            <div class="message assistant">
              <div class="avatar">O</div>
              <div class="bubble"><span class="model-tag">模型信息加载中</span>你好，我已经准备好了。问我任何问题。</div>
            </div>
          </div>
          <form class="composer" id="chat-form">
            <textarea id="question" rows="1" placeholder="给 Ollama 发消息" aria-label="问题"></textarea>
            <div class="composer-footer"><span class="composer-tip">Enter 发送 · Shift + Enter 换行</span><button type="submit" id="send-button" aria-label="发送"><span>↑</span></button></div>
          </form>
          <p class="hint" id="mode-hint">Normal 模式 · 单次最多 2,000 字</p>
          <p class="skill-hint" id="skill-hint" hidden></p>
        </section>
      </section>
      <footer class="footer-note">AI 可能会犯错，请核实重要信息。</footer>
    </section>

    <section class="main-area" id="models-view" hidden>
      <header class="topbar">
        <div class="breadcrumb"><span>模型库</span><span class="slash">/</span><strong>可用模型</strong></div>
      </header>
      <section class="workspace" aria-label="模型列表">
        <div class="alias-bar"><button id="edit-aliases" class="secondary-button" hidden>编辑别名</button></div>
        <ul class="model-list" id="model-list"></ul>
        <p class="model-empty" id="model-empty" hidden>没有发现模型</p>
      </section>
    </section>
  </main>
  <dialog class="settings-dialog" id="settings-dialog">
    <form method="dialog" class="settings-form" id="settings-form">
      <div class="settings-title"><div><span class="conversation-kicker">AGENT CONFIGURATION</span><h2>Agent 系统设置</h2></div><button class="icon-button" value="cancel" aria-label="关闭设置">×</button></div>
      <label>文章检索地址 <textarea id="search-urls" rows="3" placeholder="每行一个 HTTP(S) 地址"></textarea></label>
      <label>文章下载地址 <textarea id="download-urls" rows="3" placeholder="每行一个 HTTP(S) 地址，可留空使用候选地址"></textarea></label>
      <label>本地下载目录 <input id="download-dir" type="text" placeholder="data/articles"></label>
      <p class="settings-status" id="settings-status"></p>
      <div class="settings-actions"><button class="secondary-button" value="cancel">取消</button><button class="send-button" id="save-settings" value="default">保存设置</button></div>
    </form>
  </dialog>
  <script src="/assets/app.js?v=2"></script>
</body>
</html>
