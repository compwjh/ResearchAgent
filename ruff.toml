# Ruff 配置（ResearchAgent）
#
# 为什么要有这份配置：
#   ruff 0.16 起的默认规则集非常宽（不再只是 E4/E7/E9 + F，实测默认会报 1000+ 条），
#   且随版本升级会静默变化。这里显式固定 select / ignore，保证结果可复现。
#
# 常用命令：
#   .venv/bin/python -m ruff check .                 # 全量检查
#   .venv/bin/python -m ruff check --fix .           # 自动修复（安全修复）
#   .venv/bin/python -m ruff check --statistics .    # 按规则统计
#   .venv/bin/python -m ruff format --check .        # 格式化检查（未启用作门禁）

# 实测全仓行长度：P50=37 / P90=80 / P95=93 / P99=121。
# 沿用默认 88 会误伤 1600+ 行，故取 120（>120 的存量 233 行由 E501 忽略项兜底）。
line-length = 120

# 运行环境 Python 3.11（见 requirements.txt 注释：spec-013 从 3.9.7 升级）
target-version = "py311"

# 让 backend / tests / scripts 被识别为 first-party，isort 才能正确分三组
src = ["."]

exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    "__pycache__",
    "vendor",      # 内联的第三方代码，不属于本项目风格管辖
    "artifacts",   # 运行产物
    "data",        # 抓取与测试数据
    "node_modules",
]

[lint]
select = [
    "E",    # pycodestyle：缩进/空白/导入/语法类问题
    "W",    # pycodestyle 警告（尾随空白、无效转义等）
    "F",    # pyflakes：未使用导入与变量、未定义名、重复定义
    "I",    # isort：导入排序与分组
    "B",    # flake8-bugbear：可变默认参数、循环变量闭包等常见缺陷
    "C4",   # flake8-comprehensions：不必要的 list/dict/set 构造
    "SIM",  # flake8-simplify：可合并的 with / if / 异常抑制等
]

ignore = [
    # 存量 233 行超过 120 字符，属历史遗留，不做一次性大规模重排。
    # 待 `ruff format` 全量落地后可移除本项，改为强制 E501。
    "E501",
]

[lint.per-file-ignores]
# routes_*.py 通过 `from ...common import *` 保持向后兼容的 re-export
# （源码该行已自带 `# noqa: F401,F403`）。F405 是该模式的必然产物而非缺陷，
# 等 common 拆分收口、改为显式导入后即可移除本条。
"backend/app/api/routes_*.py" = ["F405"]

# 暂未启用的规则集及原因（后续若要加严，按此顺序推进）：
#   UP   pyupgrade：存量 630+ 处 `Optional[X]` / `List[X]` 等旧式注解，
#        建议单独一次 PR 用 `ruff check --select UP --fix` 全量处理。
#   RUF  ruff 特有规则：RUF001/002/003（歧义 Unicode 字符）对中文项目全量误报
#        （实测 1713 处，均为中文字符串/注释/文档字符串）。若启用需显式忽略这三条。
#   S    flake8-bandit：存量 610 处，需先逐条确认再启用。
